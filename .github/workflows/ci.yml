name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build-test:
    name: Build & test (macOS)
    # SECURITY: this repo is PUBLIC and CI runs on a self-hosted runner (Leon's
    # Mac), so untrusted fork-PR code must never execute here. Gate to pushes and
    # to PRs whose head branch lives in this same repo (branches Leon pushed) —
    # fork PRs are skipped. See docs/ci-self-hosted-runner.md.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # GitHub-hosted macOS runners aren't available on this account, so CI runs on a
    # self-hosted macOS runner — Leon's Mac. The custom "mustard" label ensures
    # only that machine picks up these jobs. To register one, see
    # docs/ci-self-hosted-runner.md.
    runs-on: [self-hosted, macOS, mustard]
    # The Voice Suite compiles against macOS 27-only APIs (Speech, Foundation
    # Models), so CI must build with the Xcode 27 beta SDK — the runner's
    # xcode-select default is still Xcode 26.6. DEVELOPER_DIR is the per-process
    # equivalent of xcode-select (see BAK-275); update this path when Xcode 27
    # moves to /Applications or becomes the system default.
    env:
      DEVELOPER_DIR: /Users/leoncreed-baker/Downloads/Xcode-beta.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
